name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: deno check --no-lock --node-modules-dir=manual supabase/functions/admin-users/index.ts

  smoke:
    runs-on: ubuntu-latest
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check authenticated smoke configuration
        id: smoke-config
        shell: bash
        run: |
          if [[ -n "$E2E_ADMIN_EMAIL" \
            && -n "$E2E_ADMIN_PASSWORD" \
            && -n "$VITE_SUPABASE_URL" \
            && -n "$VITE_SUPABASE_PUBLISHABLE_KEY" \
            && -n "$VITE_CLOUDINARY_CLOUD_NAME" \
            && -n "$VITE_CLOUDINARY_UPLOAD_PRESET" \
            && -n "$CLOUDINARY_CLOUD_NAME" \
            && -n "$CLOUDINARY_API_KEY" \
            && -n "$CLOUDINARY_API_SECRET" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated smoke skipped because one or more required repository secrets are not configured."
          fi
      - if: steps.smoke-config.outputs.configured == 'true'
        run: npm ci
      - if: steps.smoke-config.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.smoke-config.outputs.configured == 'true'
        run: npm run test:smoke
